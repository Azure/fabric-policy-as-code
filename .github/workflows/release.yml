name: Publish package and documentation

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: fpac-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module Az.Accounts -MinimumVersion 5.0.1 -Scope CurrentUser -Force
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Import-PowerShellDataFile .\Module\FabricPolicyAsCode\FabricPolicyAsCode.psd1
          if ($env:RELEASE_TAG -cne "v$($manifest.ModuleVersion)") {
              throw 'Release tag must exactly match v<ModuleVersion>.'
          }
      - name: Run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
              throw 'Pester release validation failed.'
          }
      - name: Build package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = .\Module\build.ps1
          $manifest = Test-ModuleManifest (Join-Path $package 'FabricPolicyAsCode.psd1')
          Import-Module (Join-Path $package 'FabricPolicyAsCode.psd1') -Force
          "version=$($manifest.Version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: .build/module
          if-no-files-found: error
          retention-days: 30

  documentation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Stamp documentation with release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/Build-Documentation.ps1 -ReleaseTag $env:RELEASE_TAG
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/site

  publish:
    needs: [build, documentation]
    runs-on: windows-latest
    environment: powershell-gallery
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: module-package
          path: package
      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          MODULE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'Configure PSGALLERY_API_KEY on the powershell-gallery environment.'
          }
          Install-Module Az.Accounts -MinimumVersion 5.0.1 -Scope CurrentUser -Force
          $package = Join-Path $PWD "package\FabricPolicyAsCode\$env:MODULE_VERSION"
          Test-ModuleManifest (Join-Path $package 'FabricPolicyAsCode.psd1') | Out-Null
          Publish-Module -Path $package -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY

  attach-package:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: module-package
          path: package
      - name: Attach installable ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MODULE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "FabricPolicyAsCode-$env:MODULE_VERSION.zip"
          Compress-Archive -LiteralPath .\package\FabricPolicyAsCode -DestinationPath $zip
          gh release upload $env:RELEASE_TAG $zip
          if ($LASTEXITCODE -ne 0) { throw 'Release ZIP upload failed.' }

  deploy-documentation:
    needs: [publish, documentation]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
