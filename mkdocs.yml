site_name: Fabric Policy as Code
site_description: Versioned, reviewed Microsoft Fabric governance with FPAC.
site_url: https://azure.github.io/fabric-policy-as-code/
repo_url: https://github.com/Azure/fabric-policy-as-code
repo_name: Azure/fabric-policy-as-code
docs_dir: .build/docs
site_dir: .build/site
theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: README.md
  - Getting started:
      - Install and use the module: docs/powershell-module.md
      - Fabric setup: docs/fabric-setup-and-create-policy.md
      - Configuration: docs/configuration.md
  - Automation:
      - GitHub actions: docs/github-actions.md
      - Identities and permissions: docs/deployment-identities.md
      - Packaging and releases: docs/releases.md
  - Reference:
      - Manual test matrix: docs/manual-test-matrix.md
      - Implementation roadmap: docs/implementation-and-validation-roadmap.md
      - Package version: docs/package-version.md
  - Contributing: CONTRIBUTING.md
  - Security: SECURITY.md
  - Code of conduct: CODE_OF_CONDUCT.md
